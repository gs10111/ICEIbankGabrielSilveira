name: iceibank

services:
  broker:
    image: rabbitmq:3-management-alpine
    container_name: iceibank-broker
    hostname: iceibank-broker
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - broker-dados:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  agencia-0:
    build: ./agencia
    image: iceibank/agencia:1.0.0
    container_name: iceibank-agencia-0
    ports: ["4016:4016"]
    environment: &ambiente-da-agencia
      AGENCIA_ID: 0
      AGENCIA_TOTAL: 3
      SERVER_PORT: 4016
      AGENCIA_URLS: http://agencia-0:4016,http://agencia-1:4017,http://agencia-2:4018
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@broker:5672/%2F}
      JWT_SEGREDO: ${JWT_SEGREDO:-iceibank-sprint2-segredo-de-desenvolvimento-trocar-em-producao}
      AGENCIA_TOKEN: ${AGENCIA_TOKEN:-token-interno-das-agencias-iceibank}
    volumes:
      - dados-agencia-0:/app/data
    depends_on:
      broker:
        condition: service_healthy

  agencia-1:
    build: ./agencia
    image: iceibank/agencia:1.0.0
    container_name: iceibank-agencia-1
    ports: ["4017:4017"]
    environment:
      <<: *ambiente-da-agencia
      AGENCIA_ID: 1
      SERVER_PORT: 4017
    volumes:
      - dados-agencia-1:/app/data
    depends_on:
      broker:
        condition: service_healthy

  agencia-2:
    build: ./agencia
    image: iceibank/agencia:1.0.0
    container_name: iceibank-agencia-2
    ports: ["4018:4018"]
    environment:
      <<: *ambiente-da-agencia
      AGENCIA_ID: 2
      SERVER_PORT: 4018
    volumes:
      - dados-agencia-2:/app/data
    depends_on:
      broker:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: iceibank/frontend:1.0.0
    container_name: iceibank-frontend
    ports: ["5173:80"]
    depends_on:
      agencia-0:
        condition: service_healthy

volumes:
  broker-dados:
  dados-agencia-0:
  dados-agencia-1:
  dados-agencia-2:
