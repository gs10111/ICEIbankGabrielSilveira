server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # A navegacao e um switch em App.jsx, nao um roteador com URLs proprias — mas
    # deixar o fallback configurado evita 404 se alguem recarregar uma rota futura.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
